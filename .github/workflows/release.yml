name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}-${{ inputs.tag }}

jobs:
  release:
    name: Build & Publish macOS Release
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Resolve release version
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) VERSION="${TAG#v}" ;;
            *)  VERSION="$TAG"; TAG="v${TAG}" ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          jq --arg v "$VERSION" '.version = $v' mygo.json > mygo.json.tmp
          mv mygo.json.tmp mygo.json

      - name: Run unit tests, visual render checks, and vet
        run: |
          SNIPGO_PREVIEW_DIR="$(mktemp -d)" CGO_ENABLED=0 go test -count=1 ./...
          go test -race -count=1 ./...
          go tool mygo vet .
          GOOS=linux CGO_ENABLED=0 go vet ./...

      - name: Configure optional Developer ID signing & notarization
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$MACOS_SIGNING_IDENTITY" ]; then
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            echo "No Developer ID certificate configured; building ad-hoc signed packages."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain

          jq --arg id "$MACOS_SIGNING_IDENTITY" '.macos.signingIdentity = $id' mygo.json > mygo.json.tmp
          mv mygo.json.tmp mygo.json

          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            xcrun notarytool store-credentials notary --keychain "$keychain" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            jq --arg kc "$keychain" '.macos.notarize = {keychainProfile: "notary", keychain: $kc}' mygo.json > mygo.json.tmp
            mv mygo.json.tmp mygo.json
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build macOS bundles and DMGs (arm64, amd64, universal)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          go tool mygo build -platform "darwin/arm64,darwin/amd64,darwin/universal"

          mkdir -p dist
          cp "build/darwin-arm64/snipgo-${VERSION}-arm64.dmg" "dist/SnipGo-${VERSION}-arm64.dmg"
          cp "build/darwin-amd64/snipgo-${VERSION}-amd64.dmg" "dist/SnipGo-${VERSION}-amd64.dmg"
          cp "build/darwin-universal/snipgo-${VERSION}.dmg" "dist/SnipGo-${VERSION}-universal.dmg"

          ditto -c -k --sequesterRsrc --keepParent "build/darwin-arm64/SnipGo.app" "dist/SnipGo-${VERSION}-arm64.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "build/darwin-amd64/SnipGo.app" "dist/SnipGo-${VERSION}-amd64.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "build/darwin-universal/SnipGo.app" "dist/SnipGo-${VERSION}-universal.app.zip"

          (cd dist && shasum -a 256 SnipGo-* > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SnipGo-${{ steps.meta.outputs.tag }}-macOS
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          NOTARIZED: ${{ steps.signing.outputs.notarized }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          {
            echo "### 下载安装（macOS 14+）"
            echo "- **Apple Silicon (M1–M5)**：\`SnipGo-${VERSION}-arm64.dmg\`（推荐）"
            echo "- **Intel Mac**：\`SnipGo-${VERSION}-amd64.dmg\`"
            echo "- **通用双架构 (Universal)**：\`SnipGo-${VERSION}-universal.dmg\`"
            if [ "$NOTARIZED" != "true" ]; then
              echo ""
              echo "> **首次打开提示（未配置 Apple 公证时）**：拖入 \`/Applications\` 后如遇系统拦截，可在「系统设置 → 隐私与安全性」点击「仍要打开」，或在终端执行一次 \`xattr -cr /Applications/SnipGo.app\`。"
            fi
          } > "$NOTES_FILE"

          FLAGS=(--repo "$GITHUB_REPOSITORY" --title "SnipGo ${VERSION}" --generate-notes --notes "$(cat "$NOTES_FILE")")
          case "$TAG" in
            *-*) FLAGS+=(--prerelease) ;;
          esac

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            FLAGS+=(--target "$GITHUB_SHA")
          else
            FLAGS+=(--verify-tag)
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* "${FLAGS[@]}"
          fi
