name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}-${{ inputs.tag }}

jobs:
  build:
    name: Build macOS Release
    runs-on: macos-latest
    timeout-minutes: 30
    # 构建与测试只需读权限；发布放到单独的 publish job。
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      notarized: ${{ steps.signing.outputs.notarized }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Resolve release version
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) VERSION="${TAG#v}" ;;
            *)  VERSION="$TAG"; TAG="v${TAG}" ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          jq --arg v "$VERSION" '.version = $v' mygo.json > mygo.json.tmp
          mv mygo.json.tmp mygo.json

      - name: Run unit tests, visual render checks, and vet
        run: |
          SNIPGO_PREVIEW_DIR="$(mktemp -d)" CGO_ENABLED=0 go test -count=1 ./...
          go test -race -count=1 ./...
          go tool mygo vet .
          GOOS=linux CGO_ENABLED=0 go vet ./...

      - name: Configure required release signing and optional notarization
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$MACOS_SIGNING_IDENTITY" ]; then
            echo "::error::Release certificate and signing identity are required"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Pin verification to the leaf identity imported into this isolated keychain.
          fingerprint="$(security find-identity -p codesigning "$keychain" | awk '$2 ~ /^[[:xdigit:]]{40}$/ {print $2}' | sort -u)"
          [[ "$fingerprint" =~ ^[[:xdigit:]]{40}$ ]] || { echo "::error::Expected one release identity"; exit 1; }
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain

          jq --arg id "$MACOS_SIGNING_IDENTITY" '.macos.signingIdentity = $id' mygo.json > mygo.json.tmp
          mv mygo.json.tmp mygo.json

          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            xcrun notarytool store-credentials notary --keychain "$keychain" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            jq --arg kc "$keychain" '.macos.notarize = {keychainProfile: "notary", keychain: $kc}' mygo.json > mygo.json.tmp
            mv mygo.json.tmp mygo.json
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build macOS bundles and DMGs (arm64, amd64, universal)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${MYGO_UPDATER_PRIVATE_KEY:-}" ] && [ -f CHANGELOG.md ]; then
            python3 - "$VERSION" <<'PY'
          import re, sys
          ver = sys.argv[1].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          found = False
          for line in text.splitlines():
              if line.startswith("## "):
                  head = line[3:].strip().split()[0].strip("[]").lstrip("v")
                  if head == ver:
                      found = True
                      break
          if not found:
              with open("CHANGELOG.md", "w", encoding="utf-8") as f:
                  f.write(text.rstrip() + f"\n\n## {ver}\n\n- 版本 v{ver} 自动构建发布\n")
          PY
          fi

          go tool mygo build -platform "darwin/arm64,darwin/amd64,darwin/universal"

          mkdir -p dist
          cp "build/darwin-arm64/snipgo-${VERSION}-arm64.dmg" "dist/SnipGo-${VERSION}-AppleSilicon-arm64.dmg"
          cp "build/darwin-amd64/snipgo-${VERSION}-amd64.dmg" "dist/SnipGo-${VERSION}-Intel-amd64.dmg"
          cp "build/darwin-universal/snipgo-${VERSION}.dmg" "dist/SnipGo-${VERSION}-Universal.dmg"

          shopt -s nullglob
          for f in build/darwin-*/update-darwin-*.json build/darwin-*/snipgo-*-darwin-*.tar.gz build/darwin-*/snipgo-*-to-*-darwin-*.delta; do
            cp "$f" dist/
          done
          if [ -n "${MYGO_UPDATER_PRIVATE_KEY:-}" ]; then
            for arch in arm64 amd64 universal; do
              test -f "dist/update-darwin-${arch}.json"
            done
          fi

          (cd dist && shasum -a 256 SnipGo-* snipgo-* update-*.json > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Verify code signature (designated requirement)
        env:
          RELEASE_FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
        run: |
          [[ "$RELEASE_FINGERPRINT" =~ ^[[:xdigit:]]{40}$ ]]
          for arch in arm64 amd64 universal; do
            apps=(build/darwin-"$arch"/*.app)
            [[ ${#apps[@]} -eq 1 && -d "${apps[0]}" ]]
            app="${apps[0]}"
            codesign --verify --deep --strict --all-architectures -R="identifier \"app.snipgo\" and certificate leaf = H\"$RELEASE_FINGERPRINT\"" "$app"
            dr="$(codesign -d -r- "$app" 2>&1 | grep 'designated =>')"
            case "$dr" in
              *cdhash*) echo "::error::$app has an unstable designated requirement"; exit 1 ;;
              *'identifier "app.snipgo"'*'certificate'*) ;;
              *) echo "::error::$app has an unexpected designated requirement"; exit 1 ;;
            esac
          done

      - name: Verify signed recording entitlements
        run: |
          for app in build/darwin-*/*.app; do
            python3 scripts/check-recording-entitlements.py "$app"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SnipGo-${{ steps.meta.outputs.tag }}-macOS
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SnipGo-${{ needs.build.outputs.tag }}-macOS
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          NOTARIZED: ${{ needs.build.outputs.notarized }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          {
            echo "### 下载安装（macOS 14+）"
            echo "- **Apple Silicon (M1–M5)**：\`SnipGo-${VERSION}-AppleSilicon-arm64.dmg\`（推荐）"
            echo "- **Intel Mac**：\`SnipGo-${VERSION}-Intel-amd64.dmg\`"
            echo "- **通用双架构 (Universal)**：\`SnipGo-${VERSION}-Universal.dmg\`"
            if [ "$NOTARIZED" != "true" ]; then
              echo ""
              echo "> **首次打开提示（未配置 Apple 公证时）**：拖入 \`/Applications\` 后如遇系统拦截，可在「系统设置 → 隐私与安全性」点击「仍要打开」，或在终端执行一次 \`xattr -cr /Applications/SnipGo.app\`。"
            fi
          } > "$NOTES_FILE"

          FLAGS=(--repo "$GITHUB_REPOSITORY" --title "SnipGo ${VERSION}" --generate-notes --notes "$(cat "$NOTES_FILE")")
          case "$TAG" in
            *-*) FLAGS+=(--prerelease) ;;
          esac

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            FLAGS+=(--target "$GITHUB_SHA")
          else
            FLAGS+=(--verify-tag)
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* "${FLAGS[@]}"
          fi
