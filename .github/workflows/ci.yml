name: CI & Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Test & Package (macOS)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Run unit tests, visual render checks, and vet
        run: |
          scripts/build-video-helper.sh "$(uname -m)"
          swift test --package-path internal/recordaudio --scratch-path "$RUNNER_TEMP/audio-tests"
          swift test --package-path internal/videocap/swift --scratch-path "$RUNNER_TEMP/video-tests"
          export SNIPGO_RGB_FIXTURE="$(go list -m -f '{{.Dir}}' github.com/egoist/mygo)/ui/video/testdata/rgb.mp4"
          ruby scripts/test-release-signing.rb
          SNIPGO_PREVIEW_DIR="$(mktemp -d)" CGO_ENABLED=0 go test -count=1 ./...
          go test -race -count=1 ./...
          go tool mygo vet .
          GOOS=linux CGO_ENABLED=0 go vet ./...

      - name: Configure optional Developer ID signing & notarization
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$MACOS_SIGNING_IDENTITY" ]; then
            echo "No signing certificate configured; using ad-hoc signing (-)."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain

          jq --arg id "$MACOS_SIGNING_IDENTITY" '.macos.signingIdentity = $id' mygo.json > mygo.json.tmp
          mv mygo.json.tmp mygo.json

          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            xcrun notarytool store-credentials notary --keychain "$keychain" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            jq --arg kc "$keychain" '.macos.notarize = {keychainProfile: "notary", keychain: $kc}' mygo.json > mygo.json.tmp
            mv mygo.json.tmp mygo.json
          fi

      - name: Build macOS bundles and DMGs (arm64, amd64, universal)
        run: |
          VERSION="$(jq -r '.version' mygo.json)"
          go tool mygo build -platform "darwin/arm64,darwin/amd64,darwin/universal"

          mkdir -p dist
          cp "build/darwin-arm64/snipgo-${VERSION}-arm64.dmg" "dist/SnipGo-${VERSION}-AppleSilicon-arm64.dmg"
          cp "build/darwin-amd64/snipgo-${VERSION}-amd64.dmg" "dist/SnipGo-${VERSION}-Intel-amd64.dmg"
          cp "build/darwin-universal/snipgo-${VERSION}.dmg" "dist/SnipGo-${VERSION}-Universal.dmg"

          (cd dist && shasum -a 256 SnipGo-* > SHA256SUMS.txt)
          ls -lh dist/

      - name: Verify code signature (designated requirement)
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          # 配置了签名证书时，发布包必须绑定证书（identifier + certificate），不能退回 cdhash，
          # 否则用户每次更新都要重新授予屏幕录制权限。
          for app in build/darwin-*/*.app; do
            codesign --verify --deep --strict --all-architectures "$app"
            helper="$app/Contents/Resources/bin/SnipGoVideo"
            test -x "$helper"
            test ! -e "$app/Contents/Frameworks/libVideocap.dylib"
            for slice in $(lipo -archs "$app/Contents/MacOS/SnipGo"); do
              lipo -verify_arch "$slice" "$helper"
            done
            if [ -n "$MACOS_SIGNING_IDENTITY" ]; then
              for code in "$app" "$helper"; do
                codesign --verify --strict --all-architectures -R='certificate leaf = H"266927f0652f68f7d6cd5c5c8535746c3dd8ce5b"' "$code"
                codesign -d -r- "$code"
                details=$(codesign -dvv "$code" 2>&1)
                [[ "$details" == *"(runtime)"* ]]
                entitlements=$(codesign -d --entitlements - "$code" 2>/dev/null)
                [[ "$entitlements" != *"com.apple.security.cs.disable-library-validation"* ]]
              done
            fi
            dr="$(codesign -d -r- "$app" 2>&1 | grep 'designated =>' || true)"
            echo "$app: $dr"
            if [ -n "$MACOS_SIGNING_IDENTITY" ]; then
              case "$dr" in
                *cdhash*|"") echo "::error::$app is not signed with the release certificate"; exit 1 ;;
              esac
              case "$dr" in
                *'identifier "app.snipgo"'*'certificate'*) ;;
                *) echo "::error::$app has an unexpected designated requirement"; exit 1 ;;
              esac
            fi
          done

      - name: Create Recorder from each runnable signed app slice
        run: |
          for arch in arm64 x86_64; do
            if [[ "$arch" == arm64 ]]; then thin=arm64; else thin=amd64; fi
            if /usr/bin/arch -"$arch" /usr/bin/true; then
              for bundle in "$thin" universal; do
                echo "Runtime check: $bundle ($arch)"
                /usr/bin/arch -"$arch" "build/darwin-$bundle/SnipGo.app/Contents/MacOS/SnipGo" --check-recorder
              done
            else
              echo "::notice::$arch cannot run on this runner; thin and universal $arch slices are signature-checked only"
            fi
          done

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SnipGo-macOS-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
